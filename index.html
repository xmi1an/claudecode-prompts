<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Prompts — Expanded Engineering Library</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="scrim" id="scrim" onclick="toggleMenu(false)"></div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <h1>Claude Code <em>Prompts</em></h1>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <div class="top">
      <button class="pill menu" onclick="toggleMenu()" aria-label="Open menu">☰</button>
      <div class="search">
        <span class="mag">⌕</span>
        <input id="q" placeholder="Search prompts, tags, situations…" autocomplete="off">
        <span class="hint">/ clear: Esc</span>
      </div>
      <button class="pill" id="allBtn" onclick="setLevel('all')">All</button>
      <button class="pill" id="bBtn" onclick="setLevel('b')">Beginner</button>
      <button class="pill" id="pBtn" onclick="setLevel('p')">Pro</button>
      <button class="pill" onclick="randomPrompt()">Random</button>
      <button class="pill" onclick="toggleTheme()" id="themeBtn">☾</button>
      <span id="count" class="pill"></span>
    </div>
    <section class="hero">
      <h2 id="title"></h2>
      <p class="sub" id="desc"></p>
      <div class="stats">
        <div class="stat"><b id="statPrompts">0</b><span>Total prompts</span></div>
        <div class="stat"><b>12</b><span>Categories</span></div>
        <div class="stat"><b id="statFavs">0</b><span>Favorites</span></div>
        <div class="stat"><b id="statShowing">0</b><span>Showing</span></div>
      </div>
      <div class="toolbar">
        <button class="pill" onclick="copyVisible()">Copy visible as Markdown</button>
        <button class="pill" onclick="exportFavorites()">Export favorites</button>
        <button class="pill" onclick="clearFilters()">Clear filters</button>
      </div>
      <details class="builder" id="builder">
        <summary>Prompt Builder</summary>
        <div class="body">
          <div class="row">
            <label>Context / files / links
              <input id="ctx" placeholder="e.g. src/auth, issue #42…" oninput="updateBuilder()">
            </label>
            <label>Constraints
              <input id="limits" placeholder="e.g. no new deps, preserve API…" oninput="updateBuilder()">
            </label>
          </div>
          <label>Definition of done
            <input id="dod" placeholder="e.g. tests green, docs updated…" oninput="updateBuilder()">
          </label>
          <div class="out" id="built">Select a prompt to begin.</div>
          <button class="copy" onclick="copyBuilt(this)">Copy built prompt</button>
        </div>
      </details>
    </section>
    <section class="grid" id="grid"></section>
  </main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
